<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="Animated illustration: hold Ctrl+Shift, speak with filler words, release, and the polished sentence is pasted at the cursor">
  <defs>
    <clipPath id="rawClip"><rect x="24" y="66" width="0" height="44">
      <set attributeName="width" to="0" begin="loop.begin"/>
      <animate attributeName="width" from="0" to="740" begin="loop.begin+0.6s" dur="2.8s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="cleanClip"><rect x="24" y="66" width="0" height="44">
      <set attributeName="width" to="0" begin="loop.begin"/>
      <animate attributeName="width" from="0" to="740" begin="loop.begin+4.6s" dur="1.2s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <!-- loop clock (invisible) -->
  <rect width="0" height="0"><animate id="loop" attributeName="x" from="0" to="0" dur="9.5s" repeatCount="indefinite"/></rect>

  <!-- window -->
  <rect x="1" y="1" width="798" height="228" rx="12" fill="#0e1622" stroke="#1c2b33"/>
  <circle cx="24" cy="21" r="5" fill="#22313b"/><circle cx="42" cy="21" r="5" fill="#22313b"/><circle cx="60" cy="21" r="5" fill="#22313b"/>
  <text x="80" y="26" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#5c7268">any app, wherever your cursor is</text>
  <line x1="1" y1="38" x2="799" y2="38" stroke="#1c2b33"/>

  <!-- raw transcript (revealed while holding, then removed) -->
  <g clip-path="url(#rawClip)" opacity="1">
    <set attributeName="opacity" to="1" begin="loop.begin"/>
    <animate attributeName="opacity" from="1" to="0" begin="loop.begin+4.0s" dur="0.35s" fill="freeze"/>
    <text x="28" y="95" font-family="Consolas, ui-monospace, monospace" font-size="17" font-style="italic" fill="#7fae97">um so basically the deploy is uh blocked on the cert renewal</text>
  </g>

  <!-- polished result -->
  <g clip-path="url(#cleanClip)">
    <text x="28" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6ede9">The deploy is blocked on the cert renewal.</text>
  </g>
  <!-- cursor caret -->
  <rect x="24" y="78" width="2" height="20" fill="#58c77a">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- keycaps -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="13">
    <rect x="28" y="160" width="52" height="32" rx="7" fill="#0c141f" stroke="#1c2b33">
      <animate attributeName="stroke" from="#1c2b33" to="#3eaf6f" begin="loop.begin+0.6s" dur="0.15s" fill="freeze"/>
      <animate attributeName="stroke" from="#3eaf6f" to="#1c2b33" begin="loop.begin+3.6s" dur="0.15s" fill="freeze"/>
    </rect>
    <text x="54" y="180" text-anchor="middle" fill="#9db3a8">Ctrl</text>
    <rect x="88" y="160" width="60" height="32" rx="7" fill="#0c141f" stroke="#1c2b33">
      <animate attributeName="stroke" from="#1c2b33" to="#3eaf6f" begin="loop.begin+0.6s" dur="0.15s" fill="freeze"/>
      <animate attributeName="stroke" from="#3eaf6f" to="#1c2b33" begin="loop.begin+3.6s" dur="0.15s" fill="freeze"/>
    </rect>
    <text x="118" y="180" text-anchor="middle" fill="#9db3a8">Shift</text>
    <text x="160" y="180" fill="#5c7268" font-size="11">hold to talk</text>
  </g>

  <!-- waveform: alive only while "held" -->
  <g fill="#58c77a">
    <rect x="260" y="173" width="6" height="6" rx="3"><animate attributeName="height" values="6;26;8;22;6" begin="loop.begin+0.6s" dur="0.75s" repeatCount="4"/><animate attributeName="y" values="173;163;172;165;173" begin="loop.begin+0.6s" dur="0.75s" repeatCount="4"/></rect>
    <rect x="274" y="173" width="6" height="6" rx="3"><animate attributeName="height" values="6;34;12;28;6" begin="loop.begin+0.72s" dur="0.75s" repeatCount="4"/><animate attributeName="y" values="173;159;170;162;173" begin="loop.begin+0.72s" dur="0.75s" repeatCount="4"/></rect>
    <rect x="288" y="173" width="6" height="6" rx="3"><animate attributeName="height" values="6;20;30;12;6" begin="loop.begin+0.66s" dur="0.75s" repeatCount="4"/><animate attributeName="y" values="173;166;161;170;173" begin="loop.begin+0.66s" dur="0.75s" repeatCount="4"/></rect>
    <rect x="302" y="173" width="6" height="6" rx="3"><animate attributeName="height" values="6;30;10;24;6" begin="loop.begin+0.78s" dur="0.75s" repeatCount="4"/><animate attributeName="y" values="173;161;171;164;173" begin="loop.begin+0.78s" dur="0.75s" repeatCount="4"/></rect>
    <rect x="316" y="173" width="6" height="6" rx="3"><animate attributeName="height" values="6;24;32;10;6" begin="loop.begin+0.84s" dur="0.75s" repeatCount="4"/><animate attributeName="y" values="173;164;159;171;173" begin="loop.begin+0.84s" dur="0.75s" repeatCount="4"/></rect>
    <rect x="330" y="173" width="6" height="6" rx="3"><animate attributeName="height" values="6;18;26;14;6" begin="loop.begin+0.69s" dur="0.75s" repeatCount="4"/><animate attributeName="y" values="173;167;163;169;173" begin="loop.begin+0.69s" dur="0.75s" repeatCount="4"/></rect>
  </g>

  <!-- status line: listening -> cleaning -> pasted -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="13">
    <text x="772" y="180" text-anchor="end" fill="#7fae97" opacity="0">listening&#8230;
      <set attributeName="opacity" to="0" begin="loop.begin"/>
      <animate attributeName="opacity" from="0" to="1" begin="loop.begin+0.6s" dur="0.2s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" begin="loop.begin+3.7s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="772" y="180" text-anchor="end" fill="#9db3a8" opacity="0">cleaning up, locally&#8230;
      <set attributeName="opacity" to="0" begin="loop.begin"/>
      <animate attributeName="opacity" from="0" to="1" begin="loop.begin+4.1s" dur="0.2s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" begin="loop.begin+5.6s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="772" y="180" text-anchor="end" fill="#58c77a" opacity="0">pasted &#183; 1.4s &#183; local
      <set attributeName="opacity" to="0" begin="loop.begin"/>
      <animate attributeName="opacity" from="0" to="1" begin="loop.begin+6.0s" dur="0.25s" fill="freeze"/>
    </text>
  </g>
</svg>
