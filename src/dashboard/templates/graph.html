{% extends "base.html" %}
{% block title %}Graph — Echo Flow{% endblock %}
{% block content %}
<div class="graph-wrap">
  <iframe src="/graph/raw" title="Knowledge graph" class="graph-frame"></iframe>
</div>
<style>
  /* Use the tokens, not copies of them: the literals here were 220px/56px
     against --sidebar-w 224px and --topbar-h 52px, so the frame overlapped the
     sidebar's last 4px and left a 4px strip under the topbar. More importantly
     this is absolutely positioned against the initial containing block, so the
     860px sidebar-collapse media query could never reach it and the frame kept
     a 220px dead gutter on a phone (measured: 145px of a 365px viewport, 40%). */
  .graph-wrap {
    position: absolute;
    inset: var(--topbar-h) 0 0 var(--sidebar-w);
  }
  @media (max-width: 860px) {
    .graph-wrap { left: 0; }
  }
  .graph-frame { width: 100%; height: 100%; border: 0; background: var(--bg); }
</style>
{% endblock %}
